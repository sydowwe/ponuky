<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Oceanik – Generátor ponúk</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@latest/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap');
:root{
  --blue:#1A5FA8;--blue-l:#D6E8F7;--blue-d:#0D3D6E;--blue-m:#4A90D9;
  --orange:#B0591A;--orange-l:#FFF3E0;
  --green:#2E7D32;--green-l:#E8F5E9;
  --dark:#1A1A2E;--grey:#F5F8FC;--grey-l:#E8EEF5;--grey-m:#CCCCCC;--hint:#888;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#EEF3F9;color:var(--dark)}
.nav{background:var(--blue-d);padding:0 28px;display:flex;align-items:center;
  justify-content:space-between;height:54px;position:sticky;top:0;z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,.25)}
.nav-logo img{height:30px;display:block}
.nav-actions{display:flex;gap:10px}
.btn{padding:7px 16px;border-radius:6px;font-family:inherit;font-size:13px;font-weight:600;
  cursor:pointer;border:none;display:flex;align-items:center;gap:6px;transition:all .2s}
.btn-print{background:rgba(255,255,255,.15);color:white}.btn-print:hover{background:rgba(255,255,255,.25)}
.btn-pdf{background:var(--orange);color:white}.btn-pdf:hover{background:#8f4514}
.layout{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 54px)}
.form-panel{background:white;border-right:1px solid var(--grey-l);overflow-y:auto;
  height:calc(100vh - 54px);position:sticky;top:54px}
.form-inner{max-width:640px;margin:0 auto}
@media(max-width:1024px){
  .layout{grid-template-columns:1fr}
  .form-panel{position:static;height:auto;border-right:none;border-bottom:1px solid var(--grey-l)}
}
.fs{border-bottom:1px solid var(--grey-l);padding:18px 22px}
.fst{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--hint);
  margin-bottom:12px;display:flex;align-items:center;gap:8px}
.fst::after{content:'';flex:1;height:1px;background:var(--grey-l)}
.fi{margin-bottom:10px}
.fi label{display:block;font-size:11px;font-weight:600;color:var(--dark);margin-bottom:3px}
.fi input,.fi select{width:100%;padding:7px 10px;border:1.5px solid var(--grey-m);border-radius:6px;
  font-family:inherit;font-size:13px;color:var(--dark);outline:none;transition:border-color .15s}
.fi input:focus,.fi select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,95,168,.1)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fr3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:7px}
.vb{background:var(--grey);border-radius:8px;padding:14px;margin-bottom:10px;border:1.5px solid var(--grey-l)}
.vh{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.vtag{background:var(--blue);color:white;font-size:10px;font-weight:700;padding:3px 10px;
  border-radius:20px;letter-spacing:.5px}
.brm{background:none;border:1px solid #ffcccc;color:#c0392b;border-radius:4px;padding:3px 8px;
  font-size:11px;cursor:pointer;font-family:inherit}.brm:hover{background:#ffeeee}
.bdup{background:none;border:1px solid var(--grey-m);color:var(--hint);border-radius:4px;padding:3px 8px;
  font-size:11px;cursor:pointer;font-family:inherit}
.bdup:hover{background:var(--blue-l);border-color:var(--blue);color:var(--blue)}
.cbox{background:white;border-radius:6px;padding:9px 12px;margin-top:9px;border:1px solid var(--grey-l)}
.cr{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;color:var(--hint)}
.cr.tot{color:var(--blue);font-weight:700;font-size:12px;border-top:1px solid var(--grey-l);margin-top:3px;padding-top:5px}
.badd{width:100%;padding:9px;border:2px dashed var(--grey-m);background:none;border-radius:8px;
  font-family:inherit;font-size:12px;color:var(--hint);cursor:pointer;transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:5px}
.badd:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-l)}

/* ---- Správa ponúk (v paneli formulára) ---- */
.fs-manage{background:var(--grey);border-bottom:2px solid var(--grey-l)}
.manage-row{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin-top:4px}
.mbtn{padding:8px 10px;border-radius:6px;font-family:inherit;font-size:12px;font-weight:600;
  cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.mbtn-save{background:var(--blue);color:white}.mbtn-save:hover{background:var(--blue-d)}
.mbtn-new{background:white;color:var(--blue);border:1.5px solid var(--grey-m)}.mbtn-new:hover{border-color:var(--blue);background:var(--blue-l)}
.mbtn-del{background:white;color:#c0392b;border:1.5px solid #ffcccc}.mbtn-del:hover{background:#ffeeee}
.save-status{font-size:11px;color:var(--green);margin-top:7px;min-height:14px;font-weight:600}
.save-status.warn{color:var(--orange)}
.btn-list{background:rgba(255,255,255,.15);color:white}.btn-list:hover{background:rgba(255,255,255,.25)}

/* ---- Odznak stavu ---- */
.stav-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  padding:3px 10px;border-radius:20px;white-space:nowrap}
.stav-badge.nezavazna{background:var(--orange-l);color:var(--orange)}
.stav-badge.akceptovana{background:var(--blue-l);color:var(--blue-d)}
.stav-badge.dokoncena{background:var(--green-l);color:var(--green)}
.pnk-stav{margin-top:6px}

/* ---- Zoznam ponúk ---- */
.list-view{display:none;padding:26px 32px;max-width:1200px;margin:0 auto}
body.view-list .layout{display:none}
body.view-list .list-view{display:block}
.lv-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.lv-title{font-size:20px;font-weight:700;color:var(--blue-d)}
.lv-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lv-search{padding:8px 12px;border:1.5px solid var(--grey-m);border-radius:6px;font-family:inherit;
  font-size:13px;min-width:230px;outline:none}
.lv-search:focus{border-color:var(--blue)}
.chip{padding:6px 13px;border-radius:20px;border:1.5px solid var(--grey-m);background:white;cursor:pointer;
  font-family:inherit;font-size:12px;font-weight:600;color:var(--hint);transition:all .15s}
.chip:hover{border-color:var(--blue-m)}
.chip.active{background:var(--blue);border-color:var(--blue);color:white}
.lv-table{width:100%;border-collapse:collapse;background:white;border-radius:10px;overflow:hidden;
  box-shadow:0 2px 14px rgba(0,0,0,.07)}
.lv-table th{background:var(--grey);text-align:left;padding:11px 14px;font-size:10px;font-weight:700;
  letter-spacing:.9px;text-transform:uppercase;color:var(--hint);border-bottom:1px solid var(--grey-l);
  cursor:pointer;user-select:none;white-space:nowrap}
.lv-table th:hover{color:var(--blue)}
.lv-table td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--grey-l);vertical-align:middle}
.lv-table tbody tr{transition:background .12s}
.lv-table tbody tr:hover{background:var(--blue-l)}
.lv-cislo{font-weight:700;color:var(--blue-d);white-space:nowrap}
.lv-sum{text-align:right;font-weight:600;white-space:nowrap}
.lv-date{color:var(--hint);font-size:12px;white-space:nowrap}
.lv-vec{color:var(--hint);font-size:12px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-act{display:flex;gap:5px;justify-content:flex-end}
.lva{padding:5px 9px;border-radius:5px;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;
  border:1.5px solid var(--grey-m);background:white;color:var(--dark);transition:all .15s;white-space:nowrap}
.lva:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
.lva-del:hover{border-color:#c0392b;color:#c0392b;background:#ffeeee}
.lv-stav-sel{font-family:inherit;font-size:11px;padding:4px 6px;border-radius:5px;
  border:1.5px solid var(--grey-m);background:white;cursor:pointer;outline:none}
.lv-stav-sel:focus{border-color:var(--blue)}
.lv-empty{padding:52px 20px;text-align:center;color:var(--hint);background:white;border-radius:10px;
  box-shadow:0 2px 14px rgba(0,0,0,.07)}
.lv-empty-t{font-size:15px;font-weight:600;margin-bottom:5px;color:var(--dark)}
.lv-count{font-size:12px;color:var(--hint);margin-top:12px}

/* Image upload */
.img-upload-area{margin-top:8px;border:2px dashed var(--grey-m);border-radius:8px;
  padding:14px;text-align:center;cursor:pointer;transition:all .2s;background:white;position:relative}
.img-upload-area:hover{border-color:var(--blue);background:var(--blue-l)}
.img-upload-area.has-img{border-style:solid;border-color:var(--blue-m);padding:6px}
.img-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.img-upload-area .img-placeholder{font-size:11px;color:var(--hint);pointer-events:none}
.img-upload-area .img-placeholder span{display:block;font-size:20px;margin-bottom:4px}
.img-preview{width:100%;max-height:120px;object-fit:contain;border-radius:4px;display:block}
.img-remove{display:block;margin-top:5px;font-size:10px;color:var(--orange);cursor:pointer;
  background:none;border:none;font-family:inherit;width:100%;text-align:center;padding:2px}
.img-remove:hover{text-decoration:underline}

.preview-panel{padding:28px;overflow-y:auto}
.plbl{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--hint);
  margin-bottom:14px;display:flex;align-items:center;gap:10px}
.plbl::after{content:'';flex:1;height:1px;background:var(--grey-m)}
.ponuka{background:white;max-width:794px;margin:0 auto;box-shadow:0 4px 32px rgba(0,0,0,.13);
  border-radius:4px;overflow:hidden}
.pnk-hdr{display:grid;grid-template-columns:1fr 1fr}
.pnk-hl{background:var(--blue-d);padding:18px 24px;display:flex;flex-direction:column;justify-content:center}
.pnk-hr{background:var(--blue-l);padding:18px 24px;text-align:right;display:flex;flex-direction:column;justify-content:center}
.pnk-logo{height:38px;object-fit:contain;object-position:left;filter:brightness(0) invert(1)}
.pnk-sub{font-size:10px;color:#9bb8d4;margin-top:4px;font-style:italic}
.pnk-ttl{font-size:26px;font-weight:700;color:var(--blue)}
.pnk-city{font-size:13px;color:var(--hint);margin-top:3px;font-style:italic}
.pnk-meta{display:grid;grid-template-columns:1fr 1fr;background:#F9FBFE;padding:16px 24px}
.mlbl{font-size:11px;color:var(--hint);font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.mval{font-size:13px;color:var(--dark);margin-top:2px;line-height:1.55}
.mval.nm{font-size:17px;font-weight:700;color:var(--orange)}
.mval.num{font-size:16px;font-weight:700;color:var(--blue)}
.mr{text-align:right}
.pnk-body{padding:20px 24px}
.vec{background:var(--blue-l);border-left:4px solid var(--blue);padding:10px 14px;
  margin:12px 0;font-size:12px;font-weight:600;color:var(--orange)}
.sttl{font-size:10px;font-weight:700;color:var(--blue);letter-spacing:1.2px;text-transform:uppercase;
  border-bottom:2px solid var(--blue);padding-bottom:5px;margin:18px 0 10px}
.sv{margin-bottom:18px}
.smtag{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.smn{font-size:15px;font-weight:700;color:var(--dark)}
.svbdg{font-size:10px;font-weight:700;color:var(--blue-m);background:var(--blue-l);padding:2px 8px;border-radius:10px}
.stbl{width:100%;border-collapse:collapse}
.stbl td{padding:6px 12px;font-size:11px;border:1px solid var(--grey-l)}
.stbl tr:nth-child(even) td{background:var(--grey)}
.stbl .sb{color:var(--blue);font-weight:700;width:22px;text-align:center}
.stbl .sk{color:var(--hint);width:145px}
.stbl .sv2{color:var(--dark);font-weight:500}
.stbl .sv2.org{color:var(--orange);font-style:italic}
.stbl .sv2.grn{color:var(--green);font-weight:700}
.mimg{margin:10px 0 14px;text-align:center;padding:4px;background:transparent}
.mimg img{max-width:100%;max-height:190px;object-fit:contain}
.ptbl{width:100%;border-collapse:collapse}
.ptbl th{background:var(--blue);color:white;padding:8px 12px;font-size:11px;font-weight:600;text-align:left}
.ptbl th:last-child{text-align:right}
.ptbl td{padding:7px 12px;font-size:12px;border-bottom:1px solid var(--grey-l)}
.ptbl tr:nth-child(even) td{background:var(--grey)}
.ptbl td:last-child{text-align:right;font-weight:500}
.ptbl .rsub td{background:var(--blue-l)!important;color:var(--blue);font-weight:700;font-size:13px;border-top:2px solid var(--blue)}
.ptbl .rtot td{background:var(--blue)!important;color:white;font-weight:700;font-size:15px;border:none;padding:11px 12px}
.ptbl .rdph td{background:white!important}
.zad{color:var(--green);font-weight:700}
.atbl{width:100%;border-collapse:collapse;margin-top:2px}
.atbl td{padding:7px 12px;font-size:11px;border:1px solid var(--grey-l)}
.atbl td:first-child{background:var(--blue-l);color:var(--blue);font-weight:700;width:33%}
.atbl tr:nth-child(even) td:last-child{background:var(--grey)}
.podmtbl{width:100%;border-collapse:collapse}
.podmtbl td{padding:7px 12px;font-size:11px;border:1px solid var(--grey-l)}
.podmtbl td:first-child{background:var(--blue-l);color:var(--blue);font-weight:700;width:33%}
.podmtbl tr:nth-child(even) td:last-child{background:var(--grey)}
.porg{color:var(--orange);font-style:italic}
.vsep{border:none;border-top:2px dashed var(--blue-l);margin:22px 0}
.pnk-footer{display:grid;grid-template-columns:1fr 1fr;padding:16px 24px 20px;
  border-top:1px solid var(--grey-m);font-size:11px;margin-top:16px;align-items:end}
.pnk-fr{text-align:right;color:var(--hint);display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.fn{font-weight:700;font-size:13px;color:var(--dark);margin-top:3px}
@media print{
  body{background:white}
  .nav,.form-panel,.plbl,.list-view,.pnk-stav{display:none!important}
  .layout{display:block!important}
  .preview-panel{padding:0}
  .ponuka{box-shadow:none;max-width:100%;border-radius:0}
  @page{margin:10mm;size:A4}
}
</style>
</head>

const MODELY = ["Klasik","Klasik Lux","Elegance Mini","Elegance","Jednokoľajové","Komfort","Praktik","Praktik Plus","Relax"];
const PROFILY = ["štandardný profil 40×50 mm","hrubý profil 65×60 mm"];
const VYPLN   = ["dutinkový polykarbonát 8 mm s UV vrstvou","číry polykarbonát 4 mm s UV vrstvou"];
const KONSTRUKCIE = ["2-dielna","3-dielna","4-dielna","5-dielna","6-dielna"];
const VEC_DEFAULT = "Ponuka na zastrešenie bazéna";

let variants=[], nid=1;

// Jediné miesto, kde je definovaný tvar variantu.
function defaultVariant(){
  return {id:0,model:"Klasik Lux",profil:PROFILY[0],vypln:VYPLN[0],
    dlzka:"",sirka:"",vyska:"",konstrukcia:"",dlzkasegmentu:"",predlzenie:"zadarmo",
    povrch:"RAL – farba podľa výberu zákazníka – <strong>bez príplatku</strong>",
    cena:0,zlava:0,zlavaTyp:'pct',montaz:0,priplatokEnabled:false,priplatokSuma:0,
    extraPopis:"",extraSuma:0,doprava:'zadarmo',imgSrc:null};
}
// Doplní chýbajúce polia pri načítaní zo servera (ochrana pri zmene polí medzi verziami).
function normalizeVariant(v){
  const d=defaultVariant(), out=Object.assign({},d,v||{});
  Object.keys(d).forEach(k=>{
    if(out[k]===undefined || (out[k]===null && d[k]!==null)) out[k]=d[k];
  });
  return out;
}
function addV(){
  variants.push(Object.assign(defaultVariant(),{id:nid++}));
  renderForm(); render();
}
function updDoprava(id,val){
  const v=variants.find(v=>v.id===id);
  if(!v) return;
  const wasZadarmo = v.doprava==='zadarmo';
  v.doprava=val;
  // Only re-render form (which destroys inputs) when switching mode
  if(wasZadarmo || val==='zadarmo') renderForm();
  render();
}
function removeV(id){variants=variants.filter(v=>v.id!==id);renderForm();render();}

// Kópia variantu so všetkými hodnotami (rozmery, ceny, príplatky) – stačí prepísať model.
function duplicateV(id){
  const i=variants.findIndex(v=>v.id===id);
  if(i<0) return;
  const copy=Object.assign({},JSON.parse(JSON.stringify(variants[i])),{id:nid++});
  variants.splice(i+1,0,copy);
  renderForm(); render();
}

function upd(id,k,val){
  const v=variants.find(v=>v.id===id);
  if(v) v[k]=["cena","zlava","montaz","priplatokSuma","extraSuma"].includes(k)?parseFloat(val)||0:val;
  if(k==="zlavaTyp")renderForm();
  render();
}

function handleImg(id, input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const v = variants.find(v=>v.id===id);
    if(v){ v.imgSrc = e.target.result; renderForm(); render(); }
  };
  reader.readAsDataURL(file);
}

function removeImg(id){
  const v=variants.find(v=>v.id===id);
  if(v){ v.imgSrc=null; renderForm(); render(); }
}

function calc(v){
  const zs=v.zlavaTyp==='eur'?(v.zlava||0):(v.cena*(v.zlava||0)/100),pz=v.cena-zs,pr=(v.priplatokSuma||0)+(v.extraSuma||0),dop=v.doprava==="zadarmo"?0:(v.doprava||0),sb=pz+v.montaz+pr+dop,dph=sb*0.23;
  return{zs,pz,pr,sb,dph,tot:sb+dph};
}
function fmt(n){
  if(!n||isNaN(n))return"0,00 €";
  return n.toLocaleString("sk-SK",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
}
function fmtD(d){
  if(!d)return new Date().toLocaleDateString("sk-SK");
  const[y,m,dd]=d.split("-");return`${dd}.${m}.${y}`;
}
function gv(id){return document.getElementById(id)?.value||"";}
function escHtml(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function renderForm(){
  document.getElementById("vlist").innerHTML=variants.map((vr,i)=>{
    const c=calc(vr);
    const autoSrc = IMGS[vr.model] || "";
    const imgSection = vr.imgSrc
      ? `<div class="img-upload-area has-img">
           <img class="img-preview" src="${vr.imgSrc}" alt="náhľad">
           <button class="img-remove" onclick="removeImg(${vr.id})"><i class="fa-solid fa-xmark"></i> Obnoviť automatický</button>
         </div>`
      : `<div class="img-upload-area has-img" style="cursor:pointer;background:var(--grey-l)" onclick="document.getElementById('imgfile_${vr.id}').click()">
           <input type="file" id="imgfile_${vr.id}" accept="image/*"
             style="display:none" onchange="handleImg(${vr.id},this)">
           <img class="img-preview" src="${autoSrc}" alt="${vr.model}" style="opacity:0.85">
           <div style="font-size:10px;color:var(--hint);margin-top:4px;text-align:center">automatický • klikni pre náhradu</div>
         </div>`;
    return`<div class="vb">
      <div class="vh">
        <span class="vtag">Variant ${i+1}</span>
        <span style="display:flex;gap:6px;align-items:center">
          <button class="bdup" onclick="duplicateV(${vr.id})" title="Vytvorí kópiu tohto variantu so všetkými hodnotami"><i class="fa-solid fa-clone"></i> Duplikovať</button>
          ${variants.length>1?`<button class="brm" onclick="removeV(${vr.id})"><i class="fa-solid fa-xmark"></i> Odstrániť</button>`:""}
        </span>
      </div>
      <div class="fi"><label>Model</label>
        <select onchange="upd(${vr.id},'model',this.value)">
          ${MODELY.map(m=>`<option${m===vr.model?" selected":""}>${m}</option>`).join("")}
        </select></div>
      <div class="fi"><label>Profil</label>
        <select onchange="upd(${vr.id},'profil',this.value)">
          ${PROFILY.map(p=>`<option${p===vr.profil?" selected":""}>${p}</option>`).join("")}
        </select></div>
      <div class="fi"><label>Povrchová úprava</label>
        <input type="text" value="${vr.povrch||'RAL – farba podľa výberu zákazníka – bez príplatku'}"
          placeholder="napr. RAL 7016 Antracit"
          oninput="upd(${vr.id},'povrch',this.value)"></div>
      <div class="fi"><label>Výplň</label>
        <select onchange="upd(${vr.id},'vypln',this.value)">
          ${VYPLN.map(p=>`<option${p===vr.vypln?" selected":""}>${p}</option>`).join("")}
        </select></div>
      <div class="fr">
        <div class="fi"><label>Dĺžka</label>
          <input placeholder="napr. 8 000 mm" value="${vr.dlzka}" oninput="upd(${vr.id},'dlzka',this.value)"></div>
        <div class="fi"><label>Šírka</label>
          <input placeholder="upresní sa" value="${vr.sirka}" oninput="upd(${vr.id},'sirka',this.value)"></div>
      </div>
      <div class="fr">
        <div class="fi"><label>Výška</label>
          <input placeholder="napr. 900 mm" value="${vr.vyska}" oninput="upd(${vr.id},'vyska',this.value)"></div>
        <div class="fi"><label>Konštrukcia</label>
          <select onchange="upd(${vr.id},'konstrukcia',this.value)">
            <option value=""${vr.konstrukcia?"":" selected"}>— upresní sa —</option>
            ${KONSTRUKCIE.map(k=>`<option${k===vr.konstrukcia?" selected":""}>${k}</option>`).join("")}
            ${vr.konstrukcia&&!KONSTRUKCIE.includes(vr.konstrukcia)
              ? `<option selected>${escHtml(vr.konstrukcia)}</option>` : ""}
          </select></div>
      </div>
      <div class="fi"><label>Dĺžka segmentu</label>
        <input placeholder="napr. 2 560 mm" value="${vr.dlzkasegmentu||''}" oninput="upd(${vr.id},'dlzkasegmentu',this.value)"></div>
      <div class="fi"><label>Predĺženie dráh</label>
        <input type="text" value="${vr.predlzenie||'zadarmo'}"
          placeholder="napr. zadarmo alebo 2 600 mm"
          oninput="upd(${vr.id},'predlzenie',this.value)"></div>
            <div class="fi"><label>Cena bez DPH (€)</label>
          <input type="number" min="0" step="0.01" value="${vr.cena||''}" placeholder="zadaj cenu bez DPH"
            style="width:100%;font-size:14px;font-weight:600"
            oninput="upd(${vr.id},'cena',this.value)"></div>
      <div class="fi"><label>Zľava</label>
          <div style="display:flex;gap:6px;margin-bottom:6px">
            <button type="button" onclick="upd(${vr.id},'zlavaTyp','pct')"
              style="flex:1;padding:7px;border-radius:6px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border:2px solid ${vr.zlavaTyp==='pct'?'var(--blue)':'var(--grey-m)'};background:${vr.zlavaTyp==='pct'?'var(--blue-l)':'white'};color:${vr.zlavaTyp==='pct'?'var(--blue)':'var(--hint)'}">% percento</button>
            <button type="button" onclick="upd(${vr.id},'zlavaTyp','eur')"
              style="flex:1;padding:7px;border-radius:6px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border:2px solid ${vr.zlavaTyp==='eur'?'var(--blue)':'var(--grey-m)'};background:${vr.zlavaTyp==='eur'?'var(--blue-l)':'white'};color:${vr.zlavaTyp==='eur'?'var(--blue)':'var(--hint)'}">€ suma</button>
          </div>
          <input type="number" min="0" step="${vr.zlavaTyp==='pct'?'0.5':'1'}"
            value="${vr.zlava||''}" placeholder="${vr.zlavaTyp==='pct'?'zadaj percento (napr. 10)':'zadaj sumu (napr. 100)'}"
            style="width:100%"
            oninput="upd(${vr.id},'zlava',this.value)">
        </div>
      <div class="fi"><label>Montáž (€)</label>
          <input type="number" min="0" step="0.01" value="${vr.montaz||''}" placeholder="zadaj sumu montáže (0 ak žiadna)"
            style="width:100%"
            oninput="upd(${vr.id},'montaz',this.value)"></div>
      <div class="fi"><label>Príplatok za číry polykarbonát (€)</label>
          <input type="number" min="0" step="0.01" value="${vr.priplatokSuma||''}" placeholder="0.00 (nepovinné)"
            oninput="upd(${vr.id},'priplatokSuma',this.value)"></div>
      <div class="fi"><label>Volný príplatok — popis</label>
        <input type="text" value="${vr.extraPopis||''}" placeholder="napr. Výklopka čela (nepovinné)"
          oninput="upd(${vr.id},'extraPopis',this.value)"></div>
      <div class="fi"><label>Volný príplatok — suma (€)</label>
        <input type="number" min="0" step="0.01" value="${vr.extraSuma||''}" placeholder="0.00"
          oninput="upd(${vr.id},'extraSuma',this.value)"></div>
      <div class="fi"><label>Doprava</label>
        <div style="display:flex;gap:8px;align-items:center">
          <button type="button" onclick="event.preventDefault();updDoprava(${vr.id},'zadarmo')"

            ZADARMO
          </button>
          <input type="number" min="0" step="0.01" id="doprava_${vr.id}"
            value="${vr.doprava!=='zadarmo'?vr.doprava:''}"
            placeholder="suma €"
            style="width:110px;padding:6px 10px;border:2px solid ${vr.doprava!=='zadarmo'&&vr.doprava>0?'var(--orange)':'var(--grey-m)'};border-radius:6px;font-family:inherit;font-size:13px"
            oninput="(function(el){const v=variants.find(v=>v.id===${vr.id});if(v){v.doprava=parseFloat(el.value)||0;render();}el.focus();})(this)">
        </div>
      </div>
      <div class="fi"><label>Obrázok modelu <span style="color:var(--hint);font-weight:400;font-size:10px">(automatický – voliteľne nahradiť)</span></label>${imgSection}</div>
      <div class="cbox">
        <div class="cr"><span>Cena po zľave</span><span>${fmt(c.pz)}</span></div>
        ${vr.priplatokSuma>0?`<div class="cr"><span>Príplatok polykarbonát</span><span>+${fmt(c.pr)}</span></div>`:""}
        ${vr.doprava!=='zadarmo'&&vr.doprava>0?`<div class="cr"><span>Doprava</span><span>+${fmt(vr.doprava)}</span></div>`:""}

        <div class="cr"><span>DPH 23 %</span><span>${fmt(c.dph)}</span></div>
        <div class="cr tot"><span>CELKOM S DPH</span><span>${fmt(c.tot)}</span></div>
      </div>
    </div>`;
  }).join("");
}

/* ================= Názov PDF: {cislo}_{meno}.pdf ================= */
function sanitizeForFile(s){
  return (s||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')   // diakritika: á→a, č→c …
    .replace(/\s+/g,'_')
    .replace(/[^A-Za-z0-9._-]/g,'')
    .replace(/_+/g,'_')
    .replace(/^[._-]+|[._-]+$/g,'');
}
function savePDF(){
  const orig = document.title;
  const cislo = sanitizeForFile(gv('cislo'));
  const meno  = sanitizeForFile(gv('zak_meno'));
  const base  = [cislo, meno].filter(Boolean).join('_') || 'ponuka';
  document.title = base;   // prehliadač z toho spraví názov súboru pri „Uložiť ako PDF“
  window.print();
  setTimeout(function(){ document.title = orig; }, 1000);
}

/* ================= Ukladanie na server (PostgreSQL) ================= */
const API = "/api/quotes";
const FIELD_IDS = ["zak_meno","zak_adresa","zak_tel","zak_email","cislo","datum",
  "vec","spracoval","termin","platnost","zaruka",
  "firma_ico","firma_icdph","firma_web","firma_adresa"];

function setStatus(msg,warn){
  const el=document.getElementById("save_status");
  if(!el) return;
  el.textContent=msg||"";
  el.className="save-status"+(warn?" warn":"");
  if(msg&&!warn){ clearTimeout(setStatus._t); setStatus._t=setTimeout(()=>{el.textContent="";},3000); }
}
function quoteTotal(){
  return variants.length ? calc(variants[0]).tot : 0;
}
function gatherState(){
  const data={};
  FIELD_IDS.forEach(id=>{ const el=document.getElementById(id); data[id]=el?el.value:""; });
  return {
    data:data,
    stav:gv("stav")||"nezavazna",
    total:quoteTotal(),
    variants:JSON.parse(JSON.stringify(variants)),
    savedAt:new Date().toISOString()
  };
}
function applyState(q){
  FIELD_IDS.forEach(id=>{ const el=document.getElementById(id); if(el&&q.data&&id in q.data) el.value=q.data[id]; });
  const s=document.getElementById("stav"); if(s) s.value=q.stav||"nezavazna";
  variants=(q.variants||[]).map(normalizeVariant);
  variants.forEach((v,i)=>{ if(!v.id) v.id=i+1; });
  nid=variants.reduce((m,v)=>Math.max(m,v.id||0),0)+1;
  if(!variants.length) addV(); else { renderForm(); render(); }
}
async function saveQuote(){
  const cislo=gv("cislo").trim();
  if(!cislo){ setStatus("Zadaj číslo ponuky pred uložením.",true); return false; }
  try{
    const res=await fetch(API+"/"+encodeURIComponent(cislo),{
      method:"PUT",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(gatherState())
    });
    if(!res.ok) throw new Error(res.status);
    setStatus("Uložené: "+cislo);
    await loadList();
    return true;
  }catch(e){ setStatus("Uloženie zlyhalo – server nedostupný.",true); return false; }
}
async function deleteQuote(){
  const cislo=gv("cislo").trim();
  if(!cislo){ setStatus("Najprv zadaj alebo načítaj ponuku.",true); return; }
  if(!confirm("Naozaj zmazať uloženú ponuku "+cislo+"?")) return;
  try{
    const res=await fetch(API+"/"+encodeURIComponent(cislo),{method:"DELETE"});
    if(!res.ok&&res.status!==404) throw new Error(res.status);
    setStatus("Zmazané: "+cislo);
    await loadList();
  }catch(e){ setStatus("Mazanie zlyhalo – server nedostupný.",true); }
}
function newQuote(){
  ["zak_meno","zak_adresa","zak_tel","zak_email","cislo"].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value="";
  });
  const vecEl=document.getElementById("vec"); if(vecEl) vecEl.value=VEC_DEFAULT;
  document.getElementById("datum").value=new Date().toISOString().slice(0,10);
  document.getElementById("stav").value="nezavazna";
  variants=[]; nid=1; addV();
  showView("editor");
  setStatus("Nová ponuka – zadaj číslo a ulož.");
  document.getElementById("cislo").focus();
}
async function onStavChange(){
  render();
  const cislo=gv("cislo").trim();
  if(!cislo) return;
  try{
    const chk=await fetch(API+"/"+encodeURIComponent(cislo));
    if(!chk.ok) return;               // ešte nie je uložená – stav sa uloží až pri „Uložiť“
    await fetch(API+"/"+encodeURIComponent(cislo),{
      method:"PUT",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(gatherState())
    });
    setStatus("Stav uložený.");
    await loadList();
  }catch(e){}
}

/* ================= Zoznam ponúk ================= */
const STAV_LABEL={nezavazna:"Nezáväzná",akceptovana:"Akceptovaná",dokoncena:"Dokončená"};
let quotesCache=[], listFilter="all", listSort={key:"savedAt",dir:-1};

function showView(v){
  document.body.classList.toggle("view-list", v==="list");
  const b=document.getElementById("btn_view");
  if(b) b.innerHTML = v==="list" ? '<i class="fa-solid fa-pen"></i> Späť na editor' : '<i class="fa-solid fa-list"></i> Zoznam ponúk';
  if(v==="list") loadList();
}
function toggleView(){
  showView(document.body.classList.contains("view-list") ? "editor" : "list");
}
function setFilter(f,btn){
  listFilter=f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  if(btn) btn.classList.add("active");
  renderList();
}
function sortBy(key){
  if(listSort.key===key) listSort.dir*=-1; else { listSort.key=key; listSort.dir=1; }
  renderList();
}
async function loadList(){
  try{
    const res=await fetch(API);
    if(!res.ok) throw new Error(res.status);
    quotesCache=await res.json();
  }catch(e){
    quotesCache=null;   // signalizuje chybu spojenia
  }
  renderList();
}
function renderList(){
  const body=document.getElementById("lv_body"), cnt=document.getElementById("lv_count");
  if(!body) return;
  if(quotesCache===null){
    body.innerHTML='<div class="lv-empty"><div class="lv-empty-t">Server nedostupný</div>'+
      'Ponuky sa nepodarilo načítať. Skontroluj pripojenie a skús obnoviť stránku.</div>';
    if(cnt) cnt.textContent=""; return;
  }
  const q=(document.getElementById("lv_search")?.value||"").trim().toLowerCase();
  let rows=quotesCache.filter(r=>{
    if(listFilter!=="all" && (r.stav||"nezavazna")!==listFilter) return false;
    if(!q) return true;
    return ((r.cislo||"")+" "+(r.zak_meno||"")+" "+(r.vec||"")).toLowerCase().includes(q);
  });
  rows.sort((a,b)=>{
    let x=a[listSort.key], y=b[listSort.key];
    if(listSort.key==="total"){ x=+x||0; y=+y||0; }
    else { x=(x||"").toString().toLowerCase(); y=(y||"").toString().toLowerCase(); }
    return x<y?-listSort.dir : x>y?listSort.dir : 0;
  });
  if(!rows.length){
    const empty = quotesCache.length
      ? '<div class="lv-empty-t">Žiadne výsledky</div>Skús zmeniť filter alebo hľadaný výraz.'
      : '<div class="lv-empty-t">Zatiaľ žiadne uložené ponuky</div>Vytvor ponuku a ulož ju tlačidlom „Uložiť ponuku“.';
    body.innerHTML='<div class="lv-empty">'+empty+'</div>';
    if(cnt) cnt.textContent=""; return;
  }
  body.innerHTML=`<table class="lv-table">
    <thead><tr>
      <th onclick="sortBy('cislo')">Číslo ▾</th>
      <th onclick="sortBy('zak_meno')">Zákazník</th>
      <th>Vec</th>
      <th onclick="sortBy('total')">Suma</th>
      <th onclick="sortBy('stav')">Stav</th>
      <th onclick="sortBy('savedAt')">Upravené</th>
      <th style="text-align:right">Akcie</th>
    </tr></thead>
    <tbody>${rows.map(r=>{
      const stav=r.stav||"nezavazna";
      const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
      const key=encodeURIComponent(r.cislo);
      return `<tr>
        <td class="lv-cislo">${esc(r.cislo)}</td>
        <td>${esc(r.zak_meno)||'<span style="color:var(--hint)">—</span>'}</td>
        <td class="lv-vec" title="${esc(r.vec)}">${esc(r.vec)||"—"}</td>
        <td class="lv-sum">${r.total?fmt(+r.total):"—"}${r.pocetVariantov>1?`<div style="font-size:10px;color:var(--hint);font-weight:400">+${r.pocetVariantov-1} variant(y)</div>`:""}</td>
        <td><select class="lv-stav-sel" onchange="changeStav('${key}',this.value)">
          ${Object.keys(STAV_LABEL).map(k=>`<option value="${k}"${k===stav?" selected":""}>${STAV_LABEL[k]}</option>`).join("")}
        </select></td>
        <td class="lv-date">${r.savedAt?new Date(r.savedAt).toLocaleString("sk-SK",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—"}</td>
        <td><div class="lv-act">
          <button class="lva" onclick="openQuote('${key}')">Otvoriť</button>
          <button class="lva" onclick="duplicateQuote('${key}')">Duplikovať</button>
          <button class="lva lva-del" onclick="deleteFromList('${key}')">Zmazať</button>
        </div></td>
      </tr>`;
    }).join("")}</tbody></table>`;
  if(cnt) cnt.textContent="Zobrazených "+rows.length+" z "+quotesCache.length+" ponúk.";
}
async function fetchQuote(key){
  const res=await fetch(API+"/"+key);
  if(!res.ok) throw new Error(res.status);
  return await res.json();
}
async function openQuote(key){
  try{ applyState(await fetchQuote(key)); showView("editor"); setStatus("Načítané: "+decodeURIComponent(key)); }
  catch(e){ alert("Ponuku sa nepodarilo načítať."); }
}
async function duplicateQuote(key){
  try{
    const q=await fetchQuote(key);
    applyState(q);
    document.getElementById("cislo").value="";      // nové číslo zadá používateľ
    document.getElementById("stav").value="nezavazna";
    document.getElementById("datum").value=new Date().toISOString().slice(0,10);
    render(); showView("editor");
    setStatus("Kópia vytvorená – zadaj nové číslo ponuky a ulož.",true);
    document.getElementById("cislo").focus();
  }catch(e){ alert("Ponuku sa nepodarilo duplikovať."); }
}
async function deleteFromList(key){
  if(!confirm("Naozaj zmazať ponuku "+decodeURIComponent(key)+"?")) return;
  try{
    const res=await fetch(API+"/"+key,{method:"DELETE"});
    if(!res.ok&&res.status!==404) throw new Error(res.status);
    await loadList();
  }catch(e){ alert("Mazanie zlyhalo."); }
}
async function changeStav(key,val){
  try{
    const res=await fetch(API+"/"+key+"/stav",{
      method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({stav:val})
    });
    if(!res.ok) throw new Error(res.status);
    // ak je práve otvorená tá istá ponuka, zosúlaď editor
    if(decodeURIComponent(key)===gv("cislo").trim()){
      document.getElementById("stav").value=val; render();
    }
    await loadList();
  }catch(e){ alert("Zmena stavu zlyhala."); }
}

/* ================= Štart ================= */
document.getElementById("datum").value=new Date().toISOString().slice(0,10);
addV();
loadList();
</script>
</body>
</html>
